<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無人レジ れんしゅう｜DONKI-REJI</title>
<link rel="stylesheet" href="css/style.css?v=20261109b">
</head>
<body>

<div id="machine">
  <div id="topbar">
    <span class="brand">セルフレジ れんしゅう</span>
    <span class="note">※お金の はらいかたを 練習するための アプリです（非公式）</span>
    <span class="spacer"></span>
    <button class="toggle" id="homeBtn" hidden>← さいしょの画面</button>
    <button class="toggle" id="kanaToggle" aria-pressed="false">あ ひらがな</button>
    <button class="toggle" id="soundToggle" aria-pressed="true">🔊 おと</button>
    <button class="toggle" id="selfcamToggle" aria-pressed="true">👤 じぶん</button>
    <a class="toggle" id="cardsLink" href="cards.html" target="_blank" rel="noopener">🖨 QRカード</a>
  </div>

  <div id="steps"></div>

  <div id="app"></div>

  <div id="stage">
    <div id="bezel">
      <!-- 画面の左上に、操作している人の顔をそのまま映すだけの窓。録画も送信もしない -->
      <div id="selfcam" hidden>
        <video id="selfVideo" playsinline muted autoplay aria-label="じぶんの かお"></video>
      </div>
      <main id="screen" aria-live="polite"></main>
    </div>
    <div id="base" aria-hidden="true">
      <div class="scanwin">スキャナ</div>
      <div class="slots">
        <div class="slot">紙幣投入口</div>
        <div class="slot">硬貨投入口</div>
      </div>
    </div>
  </div>
</div>

<div id="scanner" aria-hidden="true"><div class="beam">ピッ</div></div>

<!-- カメラでQR/バーコードを読み取る画面 -->
<div id="cam" aria-hidden="true">
  <div class="cam-box" role="dialog" aria-modal="true" aria-labelledby="camTitle">
    <div class="cam-head">
      <span id="camTitle"></span>
      <button class="btn btn-gray" id="camClose">とじる</button>
    </div>
    <div class="cam-view">
      <video id="camVideo" playsinline muted autoplay></video>
      <div class="cam-frame"></div>
    </div>
    <div class="cam-msg" id="camMsg"></div>
    <ul class="cam-list" id="camList"></ul>
  </div>
</div>
<div id="toast" role="status"></div>

<script src="vendor/jsQR.min.js"></script>
<script src="vendor/qrcode-generator.min.js"></script>
<script src="js/data.js?v=20261109b"></script>
<script src="js/app.js?v=20261109b"></script>
</body>
</html>
