<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRカード（印刷用）｜DONKI-REJI</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12mm 10mm;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    color: #111; background: #fff;
  }
  h1 { font-size: 15pt; margin: 0 0 3mm; }
  .lead { font-size: 9pt; color: #444; margin: 0 0 6mm; line-height: 1.8; }
  .lead strong { color: #c0392b; }
  .bar { margin-bottom: 7mm; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .bar button, .bar a {
    font-family: inherit; font-size: 10pt; font-weight: 700; cursor: pointer;
    padding: 8px 16px; border-radius: 6px; border: 1px solid #b9c2cc;
    background: #f3f5f8; color: #223; text-decoration: none;
  }
  .bar button.main { background: #e8871c; border-color: #c76f10; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5mm; }
  .card {
    border: 1.2pt dashed #888; border-radius: 3mm;
    padding: 3.5mm; text-align: center;
    break-inside: avoid; page-break-inside: avoid;
  }
  .card.majica { border-color: #d8251b; border-style: solid; }
  .card .no { font-size: 8pt; font-weight: 800; color: #666; letter-spacing: .06em; }
  .card .icon { font-size: 19pt; line-height: 1.1; }
  .card .icon img { width: 15mm; height: 15mm; object-fit: cover; border-radius: 2mm; display: block; margin: 0 auto; }
  .card .name { font-size: 10.5pt; font-weight: 700; margin-top: .5mm; word-break: break-word; }
  .card .kana { font-size: 7.5pt; color: #555; }
  .card .price { font-size: 13pt; font-weight: 800; color: #c0392b; margin: .8mm 0 1.6mm; }
  .card svg { width: 29mm; height: 29mm; display: block; margin: 0 auto; }
  .card .code { font-size: 6.5pt; color: #888; font-family: ui-monospace, monospace; margin-top: .8mm; }
  /* A4 1枚に収める。紙の余白は @page 側で取り、本文の padding は 0 にする */
  @page { size: A4 portrait; margin: 8mm; }
  @media print {
    body { padding: 0; }
    h1, .lead, .bar { display: none; }
  }
</style>
</head>
<body>

<h1>QRカード（印刷用）</h1>
<p class="lead">
  そのまま印刷して、点線で切り分けて使います。空き箱や実物に貼ると、より本物に近い練習になります。<br>
  アプリの「設定」で商品名・値段を変えると、<strong>このページの表示も変わります</strong>。
  QRの中身は番号（QR1、QR2…）なので、<strong>中身を変えてもカードは刷り直さなくて大丈夫です</strong>。<br>
  <strong>majicaカード</strong>は、最初の「majicaをお持ちですか」の画面で読み取るものです。
</p>

<div class="bar">
  <button class="main" onclick="window.print()">🖨 印刷する</button>
  <a href="index.html">← アプリにもどる</a>
  <span id="count"></span>
</div>

<div class="grid" id="grid"></div>

<script src="vendor/qrcode-generator.min.js"></script>
<script src="js/data.js?v=20261109b"></script>
<script>
(function () {
  'use strict';

  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };

  /* QRをSVGで描く。印刷に耐えるようベクターで出す */
  function qrSvg(text, px) {
    var qr = qrcode(0, 'M');          // 型番自動・誤り訂正レベルM
    qr.addData(text);
    qr.make();
    var n = qr.getModuleCount();
    var cell = px / n;
    var rects = '';
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (qr.isDark(r, c)) {
          rects += '<rect x="' + (c * cell).toFixed(2) + '" y="' + (r * cell).toFixed(2) +
                   '" width="' + cell.toFixed(2) + '" height="' + cell.toFixed(2) + '"/>';
        }
      }
    }
    return '<svg viewBox="0 0 ' + px + ' ' + px + '" width="' + px + '" height="' + px +
           '" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">' +
           '<rect width="' + px + '" height="' + px + '" fill="#fff"/>' +
           '<g fill="#000">' + rects + '</g></svg>';
  }

  var items = loadItems();   // js/data.js が設定を読んでくれる

  var cards = [{
    majica: true, no: 'majica', icon: '💳', img: '',
    name: 'majica カード', kana: 'さいしょに よみとる', price: null, code: 'MAJICA'
  }];
  items.forEach(function (it, i) {
    cards.push({
      no: 'QR' + (i + 1), icon: it.icon, img: it.img, name: it.k, kana: it.h,
      price: it.price, code: it.id
    });
  });

  document.getElementById('grid').innerHTML = cards.map(function (c) {
    return '<div class="card' + (c.majica ? ' majica' : '') + '">' +
      '<div class="no">' + esc(c.no) + '</div>' +
      '<div class="icon">' + (c.img
        ? '<img src="' + esc(c.img) + '" alt="">'
        : esc(c.icon)) + '</div>' +
      '<div class="name">' + esc(c.name) + '</div>' +
      '<div class="kana">' + esc(c.kana) + '</div>' +
      '<div class="price">' + (c.price != null ? c.price.toLocaleString('ja-JP') + '円' : '&nbsp;') + '</div>' +
      qrSvg(c.code, 300) +
      '<div class="code">' + esc(c.code) + '</div>' +
      '</div>';
  }).join('');

  document.getElementById('count').textContent = 'カード ' + cards.length + ' 枚';
}());
</script>
</body>
</html>
